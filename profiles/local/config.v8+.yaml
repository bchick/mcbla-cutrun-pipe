# Local / single-node profile (e.g. a workstation).
#   pixi run snakemake --profile profiles/local --configfile <your config>
cores: 32
software-deployment-method: conda
conda-frontend: conda
# conda-prefix: set by SNAKEMAKE_CONDA_PREFIX (pixi.toml); default <workdir>/.snakemake/conda
printshellcmds: true
rerun-incomplete: true
keep-going: true
resources:
  mem_mb: 200000
