# =============================================================================
# Salk / McBla lab example: GRCh38 references on the lab server
# =============================================================================
# Overrides config/config.yaml (Snakemake merges --configfile on top of it):
#
#   pixi run snakemake --configfile config/salk_example.yaml --profile profiles/local -n
#
# References are the shared copies in /data/resource (see
# /data/resource/manifest.yaml). They are byte-identical to the mcf7_project
# copies used by its CUT&RUN scripts (scripts/alignment/1.1_cutrun_align_cc.sh,
# 1.1_cutrun_align_spikein.sh, scripts/cutrun/1.3-1.8). For a new project, run
# `pixi run init` instead of copying this file.

samples: config/samples.tsv
contrasts: config/contrasts.tsv
input_mode: fastq
fastq_dir: fastq

reference:
  # Illumina iGenomes GRCh38 (NCBI), chr-prefixed; bowtie2 2.5.2 index
  fasta: /data/resource/genomes/igenomes/GRCh38/Sequence/WholeGenomeFasta/genome.fa
  bowtie2_index: /data/resource/genomes/igenomes/GRCh38/Sequence/Bowtie2Index/genome
  gtf: /data/resource/genomes/igenomes/GRCh38/Annotation/Genes.gencode/genes.gtf
  blacklist: /data/resource/blacklists/hg38-blacklist.v2.bed
  greenlist: hg38
  effective_genome_size: 2913022398
  macs2_gsize: hs
  mito_chrom: chrM

# E. coli carry-over as spike-in: the lab's combined GRCh38 + E. coli K-12
# MG1655 index (contig Ecoli_MG1655), as in 1.1_cutrun_align_spikein.sh
# (byte-identical copy of mcf7_project/data/reference/GRCh38_Ecoli).
# Uncomment to align every library to it and count E. coli fragments.
# spikein:
#   combined_bowtie2_index: /data/resource/genomes/spike_ins/ecoli_K12_MG1655/GRCh38_igenomes_Ecoli/bowtie2/genome
#   contig_prefix: "Ecoli_"
