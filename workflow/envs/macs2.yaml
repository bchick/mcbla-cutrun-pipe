# Peak calling (pipeline-tools "peaks")
#
# The build is pinned on purpose: the newer bioconda rebuilds of macs2 2.2.9.1
# (tested: py310h1fe012e_5, py311haab0aaa_3 and _5, py39hbcbf7aa_3) fail at import
# with "undefined symbol: __log_finite" on current glibc. py311hdad781d_1
# imports and runs. samtools is not needed here (FRiP uses the align env)
# and samtools 1.13 does not co-solve with Python 3.11.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python =3.11
  - macs2 =2.2.9.1=py311hdad781d_1
  - bedtools =2.30.0
